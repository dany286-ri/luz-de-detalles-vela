<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luz de Detalles | Velas personalizadas y detalles especiales</title>
    <meta
      name="description"
      content="Descubre velas personalizadas para grados, baby showers, Navidad, mascotas y momentos especiales. Detalles hechos para regalar y recordar."
    />
    <meta property="og:title" content="Luz de Detalles — Velas y detalles personalizados" />
    <meta
      property="og:description"
      content="Velas y detalles personalizados creados para regalar, celebrar y recordar. Bajo pedido, hechos con cariño."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-cream text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Formulario oculto SOLO para que Netlify Forms lo detecte durante el build
      (Netlify escanea el HTML estático, no lo que React renderiza en el navegador).
      El formulario real y visible está en src/components/ReviewForm.tsx y envía
      los datos a este mismo formulario por su "name".
    -->
    <form name="resenas" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <textarea name="resena"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <!--
      Formulario oculto de AVISO de pedidos para Netlify Forms (mismo motivo que el de reseñas).
      El pedido completo (con fotos y pagos) se guarda en la base de datos del sitio y se ve en /admin.
      Este formulario solo manda un resumen por correo si activas las notificaciones en
      Netlify → Forms → "pedidos". El checkout (src/utils/orders.ts) envía a este formulario por su "name".
    -->
    <form name="pedidos" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="pedido_id" />
      <input type="text" name="estado_pago" />
      <input type="text" name="sede" />
      <input type="text" name="nombre" />
      <input type="text" name="celular" />
      <input type="text" name="fecha_entrega" />
      <textarea name="productos"></textarea>
      <input type="text" name="total" />
      <input type="text" name="fotos" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
